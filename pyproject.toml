[project]
name = "configiq-tools"
version = "0.0.0"
description = "Repository-level automation for ConfigIQ"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
tested-models = [
    # Ground-truth extraction and parquet datasets.
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "scipy>=1.10.0",
    "pyarrow>=15.0.0",
    "huggingface_hub>=0.30.0",

    # Labeling and Triton-compatible classifier candidates.
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "kneed>=0.8.0",

    # Script quality and automated checks.
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["scripts/tested_models/legacy_mvp.py"]
