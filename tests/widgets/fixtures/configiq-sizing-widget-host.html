<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ConfigIQ sizing widget host preview</title>
  <style>
    * { box-sizing: border-box; }
    body { background: #111827; color: #f8fafc; font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; padding: 48px 24px; }
    main { margin: 0 auto; max-width: 1080px; }
    configiq-sizing-widget[theme="dark"] {
      --configiq-widget-accent: #665cff;
      --configiq-widget-accent-strong: #c4c0ff;
      --configiq-widget-border: #3f3f46;
      --configiq-widget-control: #252525;
      --configiq-widget-control-border: #484848;
      --configiq-widget-header: #252525;
      --configiq-widget-surface: #252525;
      --configiq-widget-surface-subtle: #202020;
      --configiq-widget-text: #f5f5f5;
      --configiq-widget-text-caption: #b8b8b8;
      --configiq-widget-text-muted: #d1d1d1;
    }
    .product { color: #948eff; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { font-size: 30px; margin: 6px 0 20px; }
    body[data-context="native"] { background: #f5f5f5; color: #151515; }
    body[data-context="native"] .product { color: #0066cc; }
    @media (max-width: 520px) { body { padding: 22px 14px; } h1 { font-size: 24px; } }
  </style>
</head>
<body>
  <main>
    <span class="product">Dark host · component preview</span>
    <h1>Performance sizing in a host page</h1>
    <configiq-sizing-widget
      id="sizing"
      endpoint="/api/configiq"
      timeout-ms="27000"
      theme="dark"
       full-url="https://configiq.example/predict"
      full-label="Open full Configurator"
    ></configiq-sizing-widget>
  </main>
  <script type="module">
    await import('http://localhost:3100/widgets/configiq-sizing-widget-v1.js?preview=20260825');
    const params = new URLSearchParams(location.search);
    const state = params.get('state') || 'success';
    const context = params.get('context') || 'host';
    const widget = document.querySelector('#sizing');
    document.body.dataset.context = context;
    if (context === 'native') {
      widget.removeAttribute('theme');
      document.querySelector('.product').textContent = 'ConfigIQ · native component';
      document.querySelector('h1').textContent = 'Embeddable performance sizing';
    }
    if (state === 'error') widget.setAttribute('endpoint', '/api/configiq?fail=1');
    widget.config = {
      models: [
        { value: 'qwen-2.5-7b', label: 'Qwen 2.5 7B Instruct', modelPath: 'Qwen/Qwen2.5-7B-Instruct' },
        { value: 'mistral-7b', label: 'Mistral 7B Instruct', modelPath: 'mistralai/Mistral-7B-Instruct-v0.3' }
      ],
      gpus: [
        { value: 'h200', label: 'NVIDIA H200', system: 'h200_sxm' },
        { value: 'h100', label: 'NVIDIA H100', system: 'h100_sxm' }
      ],
      seed: {
        model: state === 'empty' ? '' : 'qwen-2.5-7b',
        gpu: ['empty', 'needs-gpu'].includes(state) ? '' : 'h200',
        isl: 2048,
        osl: 512,
        concurrency: 10,
        ttft: 500
      }
    };
    if (state === 'invalid') {
      const input = widget.shadowRoot.querySelector('[data-field="isl"]');
      input.value = '0';
      input.dispatchEvent(new Event('input', { bubbles: true }));
    }
  </script>
</body>
</html>
