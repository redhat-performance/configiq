name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI only reads the checked-out source; no write scopes needed.
permissions:
  contents: read

# No path filters on any job: every push/PR checks all three components, matching
# the "release in unison" model of the build workflow.
jobs:
  check:
    name: Frontend — type-check, lint, and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  aisimulators:
    name: aisimulators API — lint and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        working-directory: services/aisimulators
        run: uv sync --extra otel --extra mcp

      - name: Lint
        working-directory: services/aisimulators
        run: uv run ruff check .

      - name: Test
        working-directory: services/aisimulators
        run: uv run pytest

  aicostings:
    name: aicostings API — lint and test
    runs-on: ubuntu-latest

    # The API tests exercise the FastAPI endpoints against a real Valkey store.
    services:
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      VALKEY_URL: valkey://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        working-directory: services/aicostings
        run: uv sync --extra dev --extra otel --extra mcp

      - name: Lint
        working-directory: services/aicostings
        run: uv run ruff check .

      - name: Test
        working-directory: services/aicostings
        run: uv run pytest
