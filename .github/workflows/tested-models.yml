name: Build tested-model performance bundle

on:
  workflow_dispatch:
    inputs:
      revision:
        description: >-
          Ground-truth dataset revision (commit SHA, branch, or tag). Leave
          empty to build the dataset repository's current default branch.
        required: false
        type: string
  schedule:
    # Fallback build. The publish workflow dispatches this workflow when new
    # ground truth is uploaded; this schedule runs after that Monday publish.
    - cron: '17 9 * * 1'
  push:
    branches: [main]
    paths:
      - 'public/config.json'
      - 'scripts/tested_models/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/tested-models.yml'

concurrency:
  group: tested-models-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Extract, train, and package tested models
    runs-on: ubuntu-latest
    if: github.repository == 'redhat-performance/configiq'
    timeout-minutes: 60
    permissions:
      contents: read

    outputs:
      dataset_revision: ${{ steps.dataset.outputs.revision }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.18'
          enable-cache: true

      - name: Install tested-model dependencies
        run: uv sync --locked --group tested-models

      - name: Run tested-model regression tests
        run: uv run --locked --group tested-models pytest scripts/tested_models/tests -q

      - name: Download ground-truth dataset
        id: dataset
        env:
          DATASET_REVISION: ${{ inputs.revision }}
          TESTED_DATASET_REPO: ${{ vars.TESTED_DATASET_REPO }}
        run: |
          if [ -n "$DATASET_REVISION" ]; then
            uv run --locked --group tested-models python scripts/tested_models/download_ground_truth.py \
              --revision "$DATASET_REVISION"
          else
            uv run --locked --group tested-models python scripts/tested_models/download_ground_truth.py
          fi
          REVISION="$(uv run --locked --group tested-models python -c \
            'import json; print(json.load(open("data/tested-models/dataset-manifest.json"))["revision"])')"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "Built from dataset revision \`$REVISION\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Create immutable grouped splits
        run: uv run --locked --group tested-models python scripts/tested_models/split_dataset.py

      - name: Fit labels from training rows
        run: uv run --locked --group tested-models python scripts/tested_models/label_data.py

      - name: Train XGBoost classifiers
        run: uv run --locked --group tested-models python scripts/tested_models/train_classifiers.py

      - name: Export Triton artifacts
        run: uv run --locked --group tested-models python scripts/tested_models/export_triton.py

      - name: Build dashboard payloads
        run: uv run --locked --group tested-models python scripts/tested_models/build_dashboard.py

      - name: Build and validate registry
        run: |
          uv run --locked --group tested-models python scripts/tested_models/build_registry.py
          uv run --locked --group tested-models python scripts/tested_models/validate_artifacts.py

      - name: Summarize registry changes
        if: always()
        env:
          BASELINE_URL: ${{ vars.TESTED_MODELS_BASELINE_URL || 'https://configiq.dev/api/tested-models' }}
          DATASET_REVISION: ${{ steps.dataset.outputs.revision }}
        run: |
          registry="data/tested-models/stage6/registry/registry.json"
          if [ ! -f "$registry" ]; then
            echo "Registry was not generated; no comparison to report." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          baseline="$RUNNER_TEMP/baseline-registry.json"
          baseline_args=()
          if curl -fsS --max-time 30 "$BASELINE_URL" -o "$baseline"; then
            baseline_args=(--baseline "$baseline")
          else
            echo "Baseline registry unavailable; reporting the new bundle only." >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "## Tested-model bundle"
            echo
            echo "- Dataset revision: \`${DATASET_REVISION:-unknown}\`"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo
            uv run --locked --group tested-models python scripts/tested_models/compare_registry.py \
              --current "$registry" "${baseline_args[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized tested-model bundle
        uses: actions/upload-artifact@v4
        with:
          name: tested-model-bundle-${{ steps.dataset.outputs.revision }}
          path: data/tested-models/stage6/registry/
          if-no-files-found: error
          retention-days: 30
