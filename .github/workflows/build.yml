name: Build and Push Containers

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    name: Build and push ${{ matrix.name }}
    runs-on: ubuntu-latest
    if: github.repository == 'redhat-performance/configiq'

    permissions:
      contents: read
      packages: write

    strategy:
      # Release all three images in unison. fail-fast cancels the remaining legs
      # the moment one fails, which shrinks — but does not eliminate — the window
      # where a tag has only some images: each leg pushes independently (push:
      # true), so a leg that finished before the failure has already published.
      # A corrected rerun republishes all three at the same tag, restoring the set.
      fail-fast: true
      matrix:
        include:
          - name: configiq
            context: .
            file: ./Containerfile
            image: ghcr.io/redhat-performance/configiq
            build-args: |
              NEXT_PUBLIC_AISIMULATORS_API_URL=https://aisimulators.dev
          # The two Python services build from the services/ context so their
          # images can pull in the shared configiq-py package.
          - name: aisimulators
            context: services
            file: services/aisimulators/Containerfile
            image: ghcr.io/redhat-performance/aisimulators
            build-args: ""
          - name: aicostings
            context: services
            file: services/aicostings/Containerfile
            image: ghcr.io/redhat-performance/aicostings
            build-args: ""

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full git history for git describe

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=latest
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
