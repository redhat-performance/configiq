name: Tested-model UI regression on dev

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
      timezone: 'America/New_York'

permissions:
  contents: read

jobs:
  tested-models:
    name: Test dev UI and AISimulators (shard ${{ matrix.shard }}/3)
    if: github.repository == 'redhat-performance/configiq'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [1, 2, 3]
    env:
      PLAYWRIGHT_BASE_URL: https://configiq.dev

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test Predict, KV cache, and Recommend sizing
        run: npm run test:e2e:nightly -- --shard=${{ matrix.shard }}/3

      - name: Upload UI test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tested-model-ui-dev-${{ github.run_id }}-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
