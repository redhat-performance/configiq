name: Build Triton Server Image

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
    paths:
      - 'services/tritonserver/**'
      - '.github/workflows/tritonserver.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: tritonserver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push tritonserver
    runs-on: ubuntu-latest
    if: github.repository == 'redhat-performance/configiq'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/redhat-performance/tritonserver
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=latest
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: services/tritonserver
          file: services/tritonserver/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=tritonserver
          cache-to: type=gha,mode=max,scope=tritonserver
