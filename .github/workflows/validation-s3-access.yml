name: Test validation S3 access

on:
  push:
    branches: ['feat/ground-truth-vs-aisim']
    paths:
      - '.github/workflows/validation-s3-access.yml'

permissions:
  id-token: write

jobs:
  read-ground-truth:
    name: Read ground-truth CSV from S3
    if: github.repository == 'redhat-performance/configiq'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Assume validation read-only role
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::194365112018:role/ConfigIQValidationGitHubActionsRole
          role-session-name: validation-access-${{ github.run_id }}
          allowed-account-ids: '194365112018'

      - name: Download and validate the ground-truth CSV
        run: |
          aws s3api get-object \
            --bucket psap-dashboard-data \
            --key staging/rhaiis-dashboard/consolidated_dashboard.csv \
            --query ContentLength \
            --output text \
            /tmp/consolidated_dashboard.csv
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path('/tmp/consolidated_dashboard.csv')
          row_count = 0
          with path.open(newline='', encoding='utf-8-sig') as source:
              reader = csv.reader(source)
              header = next(reader, None)
              if not header:
                  raise SystemExit('Downloaded CSV is empty or has no header')
              for row in reader:
                  if not row:
                      continue
                  if len(row) != len(header):
                      raise SystemExit('CSV has a row with an unexpected number of columns')
                  row_count += 1

          print(f'CSV read and parsed successfully: {path.stat().st_size} bytes, {row_count} data rows, {len(header)} columns')
          PY
