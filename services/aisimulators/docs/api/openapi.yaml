openapi: 3.1.0
info:
  title: AISimulators API
  description: |
    Minimal REST API for LLM inference GPU sizing and memory estimation.
    Wraps the aisimulate SDK (`cli_recommend` and `estimate_kv_cache`).
  version: 1.0.0
  contact:
    name: ConfigIQ team

servers:
  - url: http://localhost:7860
    description: Local development
  - url: https://aisimulators.dev
    description: Production

tags:
  - name: sizing
    description: GPU recommendation, performance estimation, and memory estimation
  - name: catalog
    description: Supported models, GPU systems, and network fabrics
  - name: observability
    description: Service metrics

# ─── Paths ──────────────────────────────────────────────────────────────────

paths:
  /recommend:
    post:
      operationId: recommend
      tags: [sizing]
      summary: Find optimal GPU configuration for a workload
      description: |
        Given a model, GPU system, backend, workload shape, and performance
        targets (SLA), finds a deployment that meets the constraints. With
        `simulator=aisimulate`, searches parallelism configurations (TP/PP/DP/EP)
        and serving modes (aggregated and disaggregated). With `simulator=blis`,
        searches aggregate TP candidates for concurrency workloads. Supplying a
        `fabric` from `/networks` also enables a bounded grid of P/D TP and
        worker-count candidates, with one node per pool. Unsupported requests
        return an error instead of falling back to AISimulate.

        The AISimulate path wraps `cli_recommend()` from the aisimulate SDK.
        The BLIS path generates a temporary Scenario and Deployment and runs the
        image-pinned BLIS CLI.

        `objective` selects what is being sized:
        - `min_gpus` (default) finds the fewest GPUs that clear the latency SLA.
          Requires `sla_mode=enforce` (the default) and exactly one of
          `target_request_rate` or `target_concurrency`. The service owns the
          search window: it starts at the model's fit floor, the smallest
          aggregated worker shape that holds one full-context sequence, and
          whose feasibility is resolved with the same runtime envelope as the
          sweep. The first window is wide —
          `floor .. min(ceiling, max(16, floor × 2))` — so the search is not
          spent below the model's size. A feasible candidate above the floor
          narrows the next window to `floor .. candidate − 1`; a window with no
          qualifying candidate grows to `upper + 1 .. upper × 2`. The configured
          ceiling is `AISIMULATORS_MAX_CANDIDATE_GPUS` (default 1024); when the
          fit floor is at or above it, the effective ceiling rises to twice the
          floor so a large model still has room to search. Each window draws its
          trial budget from its own upper bound
          (`MIN_GPUS_MAX_TRIALS`/`MIN_GPUS_PARALLELISM`/
          `MIN_GPUS_CANDIDATE_TIMEOUT_S`). The whole search shares one
          wall-clock budget (`MIN_GPUS_SEARCH_BUDGET_S`, default 70 seconds)
          across fit discovery, every window, and every backend-version
          attempt. A failed fit-floor discovery is logged and starts from the
          wide `1 .. min(ceiling, 16)` fallback window. The window actually
          searched is reported as `sweep.window_min_gpus` /
          `sweep.window_max_gpus`, alongside `sweep.configured_max_gpus` and
          `sweep.effective_max_gpus`.
        - `throughput_demand` finds the fewest GPUs that sustain
          `target_request_rate` with no latency target. It requires
          `sla_mode=none`, `target_request_rate`, and no `target_concurrency`;
          any `ttft`, `tpot`, or `request_latency` is rejected rather than
          silently dropped. A demand result reports a `demand` block. When no
          sampled configuration meets the rate, the response is still 200 with
          `demand.met=false` and the best observed rate. Compliance uses the
          rate sustained over the arrival window (excluding the final response
          drain), not `completed / duration`. AISimulate grows its GPU window
          from 8 GPUs (default) until the rate is met, the ceiling is reached,
          or the demand search budget is spent. The request carries no GPU
          bounds; the service owns the demand ladder too.
        - `concurrency_capacity` finds the fewest GPUs that hold
          `target_concurrency` sequences at the per-sequence context length
          (`max_seq_len`, else `isl + osl`) with no latency target. It requires
          `sla_mode=none`, a positive whole `target_concurrency`, and no
          `target_request_rate`; any `ttft`, `tpot`, or `request_latency` is
          rejected. Selection is a deterministic enumeration of the parallel
          search space, not a sampled sweep. The capacity answer comes from the
          selected simulator: AISimulate derives weights plus KV cache, while
          BLIS reads the KV pool the engine reports
          (`engine.cluster.kv_capacity_tokens_per_replica`) and multiplies it by
          the replicas needed. BLIS capacity is aggregate-only, so it returns no
          `capacity_options` and rejects an explicit non-null `fabric`.
          `configs[0]` is the fewest-GPU recommendation. For AISimulate,
          `capacity_options` returns a ranked comparison set that starts with
          that same minimum and adds same-GPU ties, larger aggregated
          deployments, and disaggregated deployments where the backend
          advertises them. A disaggregated deployment replicates weights in each
          pool, so it is only offered as a larger option, never as the minimum.
          When `top_n` is omitted the service returns up to 8 options when
          disaggregated candidates exist and 6 otherwise; an explicit `top_n`
          overrides that count. Each option carries its own config and capacity
          block and can be used as the primary result. Performance is simulated
          for a bounded set of AISimulate options under one shared budget;
          options that do not complete remain valid capacity answers with
          `performance_available=false` and a reason. BLIS does not simulate the
          target concurrency during capacity sizing, so its capacity result also
          reports `performance_available=false`. When the target does not fit
          inside the GPU window, the response is still 200 with
          `capacity.fits=false`, the best achievable configuration, and the
          shortfall. A window that cannot schedule any aggregated shape returns
          422 naming the window.
        - `pareto` sweeps the throughput-per-user vs throughput-per-gpu
          frontier and returns every evaluated candidate in `candidates` plus
          simulator-computed `views`. It searches both aggregated and
          disaggregated deployments (when the window can hold more than one
          GPU); a workload may legitimately have no feasible disaggregated
          point. `sla_mode=enforce` restricts the frontier to SLA-compliant
          candidates; `sla_mode=none` sweeps capacity without an SLA.
          `target_request_rate` and `target_concurrency` are rejected because
          the sweep drives its own load. AISimulate owns the window for a
          Pareto sweep: the floor is the model's fit floor (the smallest
          aggregated shape that holds one full-context sequence) and the
          ceiling is `max(configured ceiling, floor × 2)`, with the first
          window ending at `max(16, floor × 2)` so a sweep is not spent below
          the model's size. The resolved bounds are reported as
          `sweep.window_min_gpus` / `sweep.window_max_gpus`. Fit-floor discovery
          is bounded by `FIT_DISCOVERY_BUDGET_S` (default 15 seconds); when no
          aggregated shape fits within that budget, or the preflight estimate
          fails, the service logs the failure and uses the wide
          `1 .. min(ceiling, 16)` fallback window instead of returning an early
          error. BLIS has no native Pareto
          command, so the service enumerates topology and closed-loop
          concurrency combinations, runs each, and computes the non-dominated
          set itself; `sweep.algorithm="enumerate"` and
          `sweep.budget_exhausted` report whether the whole grid ran. BLIS
          includes P/D topologies only when the request names a supported
          `fabric`, and a workload may still have no feasible disaggregated
          point.

        With `sla_mode=enforce`, provide either `request_latency` (end-to-end ms)
        or both `ttft` and `tpot`; sending an end-to-end bound together with
        token-level bounds is rejected.

        BLIS supports `throughput_demand` on its pinned release by replaying
        open-loop traffic with `--rate` and a request count scaled from the
        rate. BLIS demand results are aggregate-only and report
        `demand.simulator="blis"`.

        Use the `include` query parameter to enrich each config with optional
        detail sections:
        - `config` — serving configuration (vLLM/SGLang parameters)
        - `memory` — per-component memory breakdown

        Example: `POST /recommend?include=config,memory`
      parameters:
        - name: include
          in: query
          required: false
          description: Comma-separated list of optional sections to include (config, memory).
          schema:
            type: string
            example: "config,memory"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendRequest'
      responses:
        '200':
          description: Recommendation found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendResponse'
        '422':
          description: No feasible configuration found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /estimate:
    post:
      operationId: estimate
      tags: [sizing]
      summary: Single-point performance estimate for a given parallelism configuration
      description: |
        Given a model, GPU system, backend, and explicit parallelism settings
        (TP/PP/batch_size), returns predicted TTFT, TPOT, throughput, and memory.

        Use this when you know your deployment configuration and want to predict
        its performance. Use `/recommend` when you want to find the optimal config.

        With `simulator=aisimulate`, wraps `cli_estimate()` from the aisimulate
        SDK. With `simulator=blis`, runs a generated vLLM scenario. Aggregated
        and prefill/decode disaggregated predictions are supported; P/D requests
        require an explicit `fabric` from `GET /networks`, matching GPU systems
        for both pools, and DP=1. The BLIS path creates dedicated prefill and
        decode pools, NIXL transfer, and an always-disaggregate router profile.
        Unsupported settings return an error instead of falling back to
        AISimulate. BLIS results do not include a KV-cache memory breakdown.

        Use the `include` query parameter to enrich the result with optional
        detail sections:
        - `config` — serving configuration (vLLM/SGLang parameters)
        - `memory` — per-component memory breakdown

        Example: `POST /estimate?include=config,memory`
      parameters:
        - name: include
          in: query
          required: false
          description: Comma-separated list of optional sections to include (config, memory).
          schema:
            type: string
            example: "config,memory"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstimateRequest'
      responses:
        '200':
          description: Performance estimate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateResponse'
        '422':
          description: |
            Unsupported model/backend/system combination, including a
            `backend_version` whose performance data has no measurement for
            the requested model or compute shape. The detail names the
            versions the SDK ships for the system when another version may work.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /memory:
    post:
      operationId: estimateMemory
      tags: [sizing]
      summary: Estimate GPU memory breakdown for a model configuration
      description: |
        Given a model, GPU system, backend, and parallelism configuration,
        estimates the per-rank memory breakdown: model weights, activations,
        runtime overhead, communication buffers, and KV cache capacity.

        Wraps `estimate_kv_cache()` from the aisimulate SDK.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryRequest'
      responses:
        '200':
          description: Memory estimate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryResponse'
        '422':
          description: |
            Unsupported model/backend/system combination, including a
            `backend_version` whose performance data has no measurement for
            the requested model or compute shape. The detail names the
            versions the SDK ships for the system when another version may work.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /backends:
    get:
      operationId: listBackends
      tags: [catalog]
      summary: List backend and engine-version support
      description: |
        Returns backend version support, the simulator's `simulator_version`
        and `recommend_search` shape, the sizing `objectives` this simulator
        implements, and effective memory defaults. With `simulator=blis`,
        reports the vLLM releases BLIS models, a literal default version (never
        an AISimulate alias), a `version_support` map per release, and empty
        per-system maps.
      parameters:
        - name: simulator
          in: query
          required: false
          description: Simulator whose backend support is reported. Discover supported values from GET /simulators.
          schema:
            type: string
            default: aisimulate
      responses:
        '200':
          description: Backend list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendListResponse'

  /simulators:
    get:
      operationId: listSimulators
      tags: [catalog]
      summary: List simulators this deployment can run
      description: |
        Returns simulator identity, label, description, version, and whether it
        is the default. Clients discover the list here and must not hard-code an
        ID; every `simulator` parameter or field accepts one of these `id`
        values.
      responses:
        '200':
          description: Simulator list
          content:
            application/json:
              schema:
                type: object
                required: [simulators, default_simulator]
                properties:
                  simulators:
                    type: array
                    items:
                      type: object
                      required: [id, label, description, default, version]
                      properties:
                        id:
                          type: string
                          example: blis
                        label:
                          type: string
                          example: BLIS
                        description:
                          type: string
                          description: Short explanation of what this simulator models, shown in Settings.
                          example: Discrete-event simulation of a serving cluster.
                        default:
                          type: boolean
                        version:
                          type: string
                          nullable: true
                          description: |
                            The simulator release this deployment runs, or null
                            when the artifact does not report one.
                  default_simulator:
                    type: string
                    example: aisimulate

  /models:
    get:
      operationId: listModels
      tags: [catalog]
      summary: List supported models
      description: |
        Returns supported model identifiers. Without include, returns a sorted
        list of strings. Use include=specs to get per-model metadata (MoE
        fields, context length, attention heads, architecture).

        With `simulator=blis`, returns the Hugging Face repo IDs in the pinned
        blis-catalog that ship a derived model graph. A catalog slug is accepted
        as an input alias for its Hugging Face ID.
      parameters:
        - name: include
          in: query
          required: false
          description: Comma-separated extras to include (specs).
          schema:
            type: string
            example: "specs"
        - name: simulator
          in: query
          required: false
          description: Simulator whose model support is reported. Discover supported values from GET /simulators.
          schema:
            type: string
            default: aisimulate
      responses:
        '200':
          description: Model list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelListResponse'

  /systems:
    get:
      operationId: listSystems
      tags: [catalog]
      summary: List supported GPU systems
      description: |
        Returns supported GPU systems. Each entry always includes id and name.
        Use include=specs to add hardware details (memory, TDP, architecture).

        With `simulator=blis`, returns only the systems whose hardware BLIS has a
        catalog chip for.
      parameters:
        - name: include
          in: query
          required: false
          description: Comma-separated extras to include (specs).
          schema:
            type: string
            example: "specs"
        - name: simulator
          in: query
          required: false
          description: Simulator whose GPU system support is reported. Discover supported values from GET /simulators.
          schema:
            type: string
            default: aisimulate
      responses:
        '200':
          description: System list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemListResponse'

  /networks:
    get:
      operationId: listNetworks
      tags: [catalog]
      summary: List supported network fabrics
      description: |
        Returns network fabric identifiers available to the requested simulator,
        including prefill/decode KV transfer. A simulator that does not model an
        inter-node fabric returns an empty list rather than another simulator's
        fabrics. `default_network` names the fabric a request uses when it omits
        one; null means the simulator has no fabric default.
      parameters:
        - name: simulator
          in: query
          required: false
          description: Simulator whose fabrics are reported. Discover supported values from GET /simulators.
          schema:
            type: string
            default: aisimulate
      responses:
        '200':
          description: Available network fabrics
          content:
            application/json:
              schema:
                type: object
                required: [networks, simulator, default_network]
                properties:
                  networks:
                    type: array
                    items: { type: string }
                  simulator:
                    type: string
                    description: Simulator providing the network-fabric catalog.
                  default_network:
                    type: string
                    nullable: true
                    description: Fabric used when a P/D request omits one; null when none is modeled.
        '503':
          description: The selected simulator's catalog is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /metrics:
    get:
      operationId: getMetrics
      tags: [observability]
      summary: Expose service metrics via content negotiation
      description: |
        Returns service metrics, using the `Accept` request header to select the format:
        - `Accept: application/json` → OTLP JSON (for pmdaopentelemetry and similar).
        - anything else (default) → Prometheus/OpenMetrics text.

        Only available when the optional observability extra is installed
        (`pip install '.[otel]'`); otherwise returns 503.
      responses:
        '200':
          description: Metrics payload
          content:
            text/plain:
              schema:
                type: string
                description: Prometheus/OpenMetrics text exposition.
            application/json:
              schema:
                type: object
                description: OTLP JSON metrics payload.
        '503':
          description: Metrics unavailable (observability extra not installed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

# ─── Schemas ────────────────────────────────────────────────────────────────

components:
  schemas:

    SimulatorProvenance:
      type: object
      properties:
        simulator:
          type: string
          description: Simulator identifier. Discover supported values from GET /simulators.
        simulator_version:
          type: string
          nullable: true
          description: Release of the simulator that produced this result.
        requested_model:
          type: string
          nullable: true
        resolved_model:
          type: string
          nullable: true
        model_source:
          type: string
          nullable: true
        system:
          type: string
          nullable: true
        hardware:
          type: string
          nullable: true
        model_config_relation:
          type: string
          nullable: true
          description: Relationship between the requested model configuration and the selected simulator's model data.
        engine_version:
          type: string
          nullable: true

    # ── Recommend ──────────────────────────────────────────────────────────

    RecommendRequest:
      type: object
      required: [model_path, system]
      properties:
        model_path:
          type: string
          description: HuggingFace model path or SDK model key.
          example: Qwen/Qwen3-32B-FP8
        system:
          type: string
          description: GPU system identifier.
          example: h200_sxm
        simulator:
          type: string
          default: aisimulate
          description: Simulator to use. Discover supported values from GET /simulators. A request never falls back to another simulator.
        backend:
          type: string
          description: Inference backend.
          enum: [vllm, sglang, trtllm]
          default: vllm
        backend_version:
          type: string
          nullable: true
          description: |
            Backend version. AISimulate: null resolves to the system default
            (`current`, the same value `/backends` reports in
            `system_defaults`); the `current` alias behaves the same way. If
            that version has no performance data for the model, the service
            retries the newest declared versions and reports the one it used.
            Literal versions, `previous`, and `next` are pins and are never
            substituted: if the data cannot serve them, the request returns 422
            naming the versions the SDK ships for the system. BLIS: must be one
            of the modeled vLLM releases (0.29.0, 0.31.0, 0.32.0); null uses
            0.31.0. Aliases and unmodeled releases return 422.
          default: null
        target_request_rate:
          type: number
          nullable: true
          description: |
            Offered request rate in req/s. With objective=min_gpus this is a
            minimum-goodput constraint; set exactly one of this or
            target_concurrency. With objective=throughput_demand it is the
            arrival rate the cluster must sustain and is required.
          default: null
        target_concurrency:
          type: number
          nullable: true
          description: |
            Target concurrent users (closed-loop load). With
            objective=concurrency_capacity it is the number of sequences the
            deployment must hold, and must be a positive whole number. Rejected
            with objective=throughput_demand and objective=pareto.
          default: null
        objective:
          type: string
          enum: [min_gpus, throughput_demand, pareto, concurrency_capacity]
          default: min_gpus
          description: Optimization objective. See the endpoint description for the supported request shape per objective.
        sla_mode:
          type: string
          enum: [enforce, none]
          default: enforce
          description: |
            Whether latency targets constrain the result. enforce requires a
            TTFT/TPOT or end-to-end bound, and is required by
            objective=min_gpus. none rejects every latency bound; it is
            required by objective=throughput_demand and
            objective=concurrency_capacity, and optional for objective=pareto
            (an SLA-free capacity sweep).
        kv_transfer_bandwidth_gb_per_second:
          type: number
          nullable: true
          description: |
            P/D KV transfer bandwidth to model with objective=pareto under
            AISimulate. Omit to apply AISimulate's default of no modeled
            transfer delay; omission is not a fabric default. BLIS models P/D
            transfer through the selected `fabric` and rejects this field with
            422. A non-null value for any other objective is rejected with 422
            rather than silently ignored.
          default: null
        isl:
          type: integer
          description: Input sequence length (tokens).
          default: 4000
        osl:
          type: integer
          description: Output sequence length (tokens).
          default: 1000
        ttft:
          type: number
          nullable: true
          description: Time to first token target (ms). Required with sla_mode=enforce unless request_latency is set.
          default: null
        tpot:
          type: number
          nullable: true
          description: Time per output token target (ms). Required with sla_mode=enforce unless request_latency is set.
          default: null
        request_latency:
          type: number
          nullable: true
          description: End-to-end request latency target (ms). Mutually exclusive with ttft/tpot. Optional.
          default: null
        prefix:
          type: integer
          description: Prefix cache length (tokens).
          default: 0
        database_mode:
          type: string
          description: Performance database mode.
          enum: [HYBRID, SILICON, EMPIRICAL, SOL]
          default: HYBRID
        top_n:
          type: integer
          description: |
            Number of configurations to return. Omit to let the service use its
            goal-specific default (5). For objective=concurrency_capacity the
            default comparison set is 8 options when disaggregated candidates
            exist and 6 otherwise; an explicit value overrides it.
          default: 5
          minimum: 1
          maximum: 20
        search_budget_seconds:
          type: integer
          description: BLIS total search budget in seconds; capped at 60 and reduced by the web gateway when needed.
          default: 60
          minimum: 1
          maximum: 60
        inclusive_tpot:
          type: boolean
          description: |
            Report TPOT as (ttft + tpot * (osl - 1)) / osl, spreading TTFT across all
            output tokens. Useful for comparing with benchmarks that report inclusive
            TPOT (e.g. GuideLLM).
          default: false
        model_config:
          type: object
          nullable: true
          description: Pre-fetched HuggingFace model config.json. Skips the HF download when supplied.
          default: null
        fabric:
          type: string
          nullable: true
          minLength: 1
          description: Inter-node fabric for topology-aware P/D candidates. BLIS defaults to roce-200g when omitted; explicitly set null to skip P/D candidates. BLIS concurrency-capacity sizing is aggregate-only and rejects an explicit non-null fabric. AISimulate does not consume this field.

    RecommendResponse:
      type: object
      required: [configs, chosen_mode]
      properties:
        simulator:
          type: string
          description: Simulator that produced the result, as reported by the service.
        configs:
          type: array
          description: Top configurations ranked by fewest GPUs, then throughput.
          items:
            $ref: '#/components/schemas/RecommendConfig'
        chosen_mode:
          type: string
          description: Serving mode chosen (agg or disagg).
          example: agg
        search_summary:
          type: object
          nullable: true
          description: Candidate GPU totals, modes, evaluated configurations, and applied bounds.
          properties:
            strategy: { type: string, example: tensor_parallel_only }
            candidate_gpus: { type: array, items: { type: integer } }
            evaluated_gpus: { type: array, items: { type: integer } }
            configured_max_gpus: { type: integer }
            hardware_max_gpus: { type: integer }
            effective_max_gpus: { type: integer }
            time_budget_seconds: { type: number }
            budget_exhausted: { type: boolean }
            modes_searched: { type: array, items: { type: string, enum: [agg, disagg] } }
            candidate_configurations: { type: integer }
            evaluated_configurations: { type: integer }
        demand:
          allOf:
            - $ref: '#/components/schemas/DemandOutcome'
          nullable: true
          description: |
            Measured throughput-demand outcome. Present only with
            objective=throughput_demand, including when the target was not met
            (200 with met=false). Values come from the selected candidate's
            replay metrics, not from the requested target.
        capacity:
          allOf:
            - $ref: '#/components/schemas/CapacityOutcome'
          nullable: true
          description: |
            KV-residency outcome. Present only with
            objective=concurrency_capacity, including when the target could not
            fit (200 with fits=false). The fit comes from the selected
            simulator's capacity answer (AISimulate's KV estimate or BLIS's
            reported engine KV pool), not from the informational performance
            simulation.
        capacity_options:
          type: array
          description: |
            Ranked deployment alternatives for objective=concurrency_capacity.
            `capacity_options[0]` is the primary recommendation and matches
            `configs[0]`. Empty for every other objective. Each entry is a
            complete alternative with its own config and capacity outcome, so a
            client can promote it without re-running the search. Options that
            could not be simulated remain present with
            `capacity.performance_available=false`.
          items:
            $ref: '#/components/schemas/CapacityOption'
        sweep:
          allOf:
            - $ref: '#/components/schemas/SweepMeta'
          nullable: true
          description: Run-control facts for the search that produced this result.
        candidates:
          type: array
          description: |
            Every evaluated candidate from an objective=pareto sweep, including
            infeasible and timed-out records. Empty for other objectives. Values
            are copied verbatim from the selected simulator; unsupported detail
            stays unavailable rather than being synthesized.
          items:
            $ref: '#/components/schemas/CandidateResponse'
        views:
          allOf:
            - $ref: '#/components/schemas/CandidateViews'
          nullable: true
          description: |
            Candidate-ID lists computed by the simulator. Present for
            objective=pareto. `pareto_front` is authoritative for the
            simulator's own objectives; clients must not substitute a locally
            computed frontier for it.

    DemandOutcome:
      type: object
      required: [target_rps, met, simulator]
      properties:
        target_rps:
          type: number
          description: Offered request rate the run was asked to sustain (req/s).
        achieved_rps:
          type: number
          nullable: true
          description: |
            Request rate sustained over the arrival window of the selected
            candidate (req/s). A replay is timed to its final completion, so
            `completed / duration` includes one response drain; this value
            subtracts the mean E2E latency instead and is directly comparable
            to `target_rps`.
        met:
          type: boolean
          description: |
            True when the selected candidate sustained target_rps within a small
            relative tolerance. This is the best of the evaluated candidates,
            not a capacity guarantee.
        observed_concurrency:
          type: number
          nullable: true
          description: Little's-law estimate, achieved_rps x mean E2E latency / 1000. Omitted when the run completed no work.
        window_seconds:
          type: number
          nullable: true
          description: |
            Arrival window in seconds: the replay duration minus one mean E2E
            latency. Excludes the final response drain.
        completed_requests:
          type: integer
          nullable: true
          description: Requests completed during the replay window.
        evaluated_configurations:
          type: integer
          nullable: true
          description: Number of candidates with a usable rate measurement.
        best_observed_rps:
          type: number
          nullable: true
          description: Highest sustained arrival-window rate across evaluated candidates, reported when the target is unmet.
        simulator:
          type: string
          description: Simulator that produced the result, as reported by the service.

    CapacityOutcome:
      type: object
      required:
        - target_concurrency
        - context_per_sequence_tokens
        - capacity_tokens
        - capacity_sequences
        - fits
        - per_rank_tokens
        - replicas
        - attention_dp
        - evaluated_shapes
        - feasible_shapes
        - simulator
      properties:
        target_concurrency:
          type: integer
          description: Sequences the deployment was asked to hold.
        context_per_sequence_tokens:
          type: integer
          description: |
            Peak tokens one resident sequence can occupy: `max_seq_len` when
            set, otherwise `isl + osl`. No prefix-cache credit is applied.
        capacity_tokens:
          type: integer
          description: |
            Aggregate KV-cache tokens the selected deployment holds:
            `per_rank_tokens × attention_dp × replicas`. Unused tokens in one
            replica cannot serve a sequence on another.
        capacity_sequences:
          type: integer
          description: |
            Whole sequences of context_per_sequence_tokens the deployment
            holds. Sequences cannot span replicas, so this is whole sequences
            per replica multiplied by the replica count, not the pooled token
            total divided by the context length.
        fits:
          type: boolean
          description: True when capacity_sequences >= target_concurrency.
        shortfall_sequences:
          type: integer
          nullable: true
          description: Missing sequences when fits=false; null when the target fits.
        shortfall_tokens:
          type: integer
          nullable: true
          description: |
            KV tokens for the sequences that do not fit when fits=false
            (`shortfall_sequences × context_per_sequence_tokens`); null when
            the target fits.
        minimum_gpus:
          type: integer
          nullable: true
          description: Fewest GPUs inside the requested window that hold one sequence.
        per_rank_tokens:
          type: integer
          description: |
            KV-cache tokens held by one attention rank of the capacity-bearing
            pool. For a disaggregated option this is the decode pool. BLIS
            capacity is aggregate-only; with attention DP 1 the reported
            per-replica pool is also the per-rank figure.
        replicas:
          type: integer
          description: |
            Replicas of the selected worker shape. For a disaggregated option
            this is the decode replica count; prefill is reported separately.
        attention_dp:
          type: integer
          description: |
            Attention data-parallel width of the capacity-bearing worker shape.
            Each DP rank contributes its own KV budget. For a disaggregated
            option this describes the decode pool.
        mode:
          type: string
          enum: [agg, disagg]
          description: Serving mode of this capacity option.
        prefill_replicas:
          type: integer
          nullable: true
          description: Prefill replicas for a disaggregated option; null for agg.
        decode_replicas:
          type: integer
          nullable: true
          description: Decode replicas for a disaggregated option; null for agg.
        prefill_gpus:
          type: integer
          nullable: true
          description: Total prefill-pool GPUs for a disaggregated option; null for agg.
        decode_gpus:
          type: integer
          nullable: true
          description: |
            Total decode-pool GPUs for a disaggregated option. The decode pool
            holds the resident sequences; prefill only holds one transiently.
            Null for agg.
        evaluated_shapes:
          type: integer
          description: Aggregated shapes the capacity search evaluated.
        feasible_shapes:
          type: integer
          description: Aggregated shapes that held at least one sequence.
        exhaustive:
          type: boolean
          description: |
            True when capacity enumerated the shape space instead of sampling
            it. BLIS reports false when its search time budget stopped the
            enumeration or a run failed, so the minimum is not confirmed.
        performance_available:
          type: boolean
          description: |
            True when the informational simulation at the requested concurrency
            produced timing data. It never affects `fits`. Always false for BLIS
            capacity sizing, which reads the KV pool without simulating the
            target concurrency.
        performance_unavailable_reason:
          type: string
          nullable: true
          description: Why the informational simulation was unavailable, when it was.
        simulator:
          type: string
          description: Simulator that produced this capacity result.

    CapacityOption:
      type: object
      required: [option_id, rank, role, gpus_over_minimum, config, capacity]
      properties:
        option_id:
          type: string
          description: Stable identifier for this alternative within the response.
        rank:
          type: integer
          description: 1-based rank. Rank 1 is the primary recommendation.
        role:
          type: string
          enum: [minimum, same_gpus, larger, disaggregated, shortfall]
          description: |
            Why the option is in the comparison set: the fewest-GPU minimum,
            a same-GPU tie, a larger deployment, a disaggregated deployment, or
            the best-effort deployment when the target does not fit.
        gpus_over_minimum:
          type: integer
          description: GPUs above the fewest-GPU minimum; 0 for the minimum.
        config:
          $ref: '#/components/schemas/RecommendConfig'
        capacity:
          $ref: '#/components/schemas/CapacityOutcome'

    SweepMeta:
      type: object
      properties:
        run_id: { type: string, nullable: true }
        algorithm:
          type: string
          nullable: true
          example: random
          description: |
            Sampler used by AISimulate (`random` or `bayesian`). BLIS enumerates
            its candidate grid and reports `enumerate`. Capacity sizing also
            enumerates and reports `enumerate` with `budget_exhausted=false`.
        seed: { type: integer, nullable: true }
        max_trials: { type: integer, nullable: true, description: Total trial budget, split across searched deployment modes. }
        evaluated: { type: integer, nullable: true }
        feasible: { type: integer, nullable: true }
        timed_out: { type: integer, nullable: true }
        budget_exhausted:
          type: boolean
          description: |
            Whether a wall-clock search budget stopped the run. BLIS reports
            true when its search time budget stopped the enumeration before
            every grid point ran. AISimulate reports true when a window-ladder
            search ran out of its whole-request time budget
            (`MIN_GPUS_SEARCH_BUDGET_S` / `DEMAND_SEARCH_BUDGET_S`). A sampled
            sweep's trial spend is reported separately by `max_trials` and
            `evaluated`; `evaluated >= max_trials` means that budget was spent.
            In no case does true imply the search was exhaustive.
        strict_sla: { type: boolean, nullable: true }
        window_min_gpus:
          type: integer
          nullable: true
          description: Lowest GPU count in the window the service actually searched.
        window_max_gpus:
          type: integer
          nullable: true
          description: Highest GPU count in the window the service actually searched.
        configured_max_gpus:
          type: integer
          nullable: true
          description: |
            Configured candidate ceiling (`AISIMULATORS_MAX_CANDIDATE_GPUS`).
            This is a soft budget, not a promise about the largest searchable
            window.
        effective_max_gpus:
          type: integer
          nullable: true
          description: |
            Ceiling the search was allowed to reach. It equals
            `configured_max_gpus` unless the fit floor required headroom, in
            which case it is `max(configured_max_gpus, floor × 2)`.

    CandidateResponse:
      type: object
      required: [candidate_id, status, mode, topology, simulator]
      description: |
        One evaluated candidate from a pareto sweep. AISimulate candidates are
        copied verbatim from the SDK record; BLIS candidates are constructed by
        the service from its own measured runs.
      properties:
        candidate_id: { type: string }
        status:
          type: string
          enum: [feasible, infeasible, unsupported, timed_out, failed, resource_limited]
        reason_category: { type: string, nullable: true }
        mode: { type: string, example: agg }
        topology:
          type: object
          description: SDK flat parallelism keys (deployment_mode, tp, pp, prefill_tp, decode_tp, …), verbatim.
          additionalProperties: true
        used_gpus: { type: integer, nullable: true }
        metrics:
          type: object
          additionalProperties: { type: number, nullable: true }
          description: Measured replay metrics for this candidate.
        objectives:
          type: object
          nullable: true
          additionalProperties: { type: number }
          description: SDK objective values, e.g. throughput_per_user and throughput_per_gpu.
        transfer_delay_modeled:
          type: boolean
          description: True only when a P/D transfer delay was actually modeled for this candidate.
        provenance_sources:
          type: array
          items: { type: string }
        simulator:
          type: string
          description: Simulator that produced this candidate.

    CandidateViews:
      type: object
      description: Candidate-ID lists computed by the selected simulator. IDs must exist in `candidates`.
      properties:
        pareto_front:
          type: array
          items: { type: string }
          description: Non-dominated candidate IDs for the simulator's own objectives.
        top_n:
          type: array
          items: { type: string }

    RecommendConfig:
      type: object
      properties:
        simulator:
          type: string
          description: Simulator that produced the result, as reported by the service.
        provenance:
          $ref: '#/components/schemas/SimulatorProvenance'
        warnings:
          type: array
          items: { type: string }
        # GPU sizing
        total_gpus_needed:
          type: integer
          description: Cluster-wide GPUs used by the complete returned candidate.
        replicas_needed:
          type: integer
          description: Number of scalable aggregate replicas represented by the candidate. Disaggregated candidates are returned as one complete multi-pool replica.
        num_total_gpus:
          type: integer
          description: GPUs in one aggregate replica (TP x PP x DP x CP). For disaggregated results, inspect the phase configurations.

        # Parallelism
        tp:
          type: integer
          description: Tensor parallel size.
        pp:
          type: integer
          description: Pipeline parallel size.
        dp:
          type: integer
          description: Data parallel size.
        moe_tp:
          type: integer
          nullable: true
          description: MoE tensor parallel size (MoE models only).
        moe_ep:
          type: integer
          nullable: true
          description: MoE expert parallel size (MoE models only).
        cp:
          type: integer
          nullable: true
          description: Context parallel size.

        # Performance
        ttft:
          type: number
          description: Predicted TTFT (ms).
        tpot:
          type: number
          description: Predicted time per output token (ms/token).
        request_latency:
          type: number
          description: Predicted end-to-end request latency (ms).
        concurrency:
          type: integer
          description: Cluster-wide concurrency level at which these metrics hold.
        request_rate:
          type: number
          description: Achievable request rate (req/s).

        # Throughput
        tokens_per_second:
          type: number
          description: Cluster-wide output-token throughput (tokens/s) for the complete candidate.
        tokens_per_second_per_gpu:
          type: number
          description: Tokens/s per GPU.
        tokens_per_second_per_user:
          type: number
          description: Tokens/s per concurrent user.

        # Memory and metadata
        memory:
          type: number
          description: Worst-case peak memory usage per GPU (GB).
        model:
          type: string
          description: Resolved model identifier.
        system:
          type: string
          description: GPU system used.
        backend:
          type: string
          description: Backend used.
        backend_version:
          type: string
          description: Backend version used.

        # Quantization
        gemm:
          type: string
          description: GEMM quantization mode.
        kvcache:
          type: string
          description: KV cache quantization mode.
        fmha:
          type: string
          description: FMHA quantization mode.
        moe:
          type: string
          nullable: true
          description: MoE quantization mode.
        comm:
          type: string
          nullable: true
          description: Communication quantization mode.

        # Power
        power_w:
          type: number
          nullable: true
          description: Estimated power draw (watts).

        # Optional detail sections (present when requested via include= query param)
        serving_config:
          nullable: true
          description: Serving configuration (present when include=config).
          $ref: '#/components/schemas/ServingConfig'
        memory_breakdown:
          nullable: true
          description: Per-component memory breakdown (present when include=memory).
          $ref: '#/components/schemas/MemoryBreakdown'

        # Disaggregated detail (present for disagg results)
        prefill_config:
          nullable: true
          description: Prefill worker parallelism and serving config (disaggregated results only).
          $ref: '#/components/schemas/WorkerConfig'
        decode_config:
          nullable: true
          description: Decode worker parallelism and serving config (disaggregated results only).
          $ref: '#/components/schemas/WorkerConfig'

    WorkerConfig:
      type: object
      description: Parallelism and serving config for one worker role in a disaggregated deployment.
      properties:
        tp:
          type: integer
          nullable: true
          description: Tensor parallel size.
        pp:
          type: integer
          nullable: true
          description: Pipeline parallel size.
        dp:
          type: integer
          nullable: true
          description: Data parallel size.
        moe_tp:
          type: integer
          nullable: true
          description: Resolved MoE/FFN tensor width for this pool.
        moe_ep:
          type: integer
          nullable: true
          description: Resolved MoE/FFN expert width for this pool.
        num_workers:
          type: integer
          nullable: true
          description: Number of workers for this role.
        memory_gb:
          type: number
          nullable: true
          description: Memory usage (GB).
        gemm:
          type: string
          nullable: true
          description: GEMM quantization mode.
        kvcache:
          type: string
          nullable: true
          description: KV cache quantization mode.
        fmha:
          type: string
          nullable: true
          description: FMHA quantization mode.
        moe:
          type: string
          nullable: true
          description: MoE quantization mode.
        comm:
          type: string
          nullable: true
          description: Communication quantization mode.
        backend_version:
          type: string
          nullable: true
          description: Backend version used.
        memory_breakdown:
          nullable: true
          description: Per-component memory breakdown (present when include=memory).
          $ref: '#/components/schemas/MemoryBreakdown'

    ServingConfig:
      type: object
      description: Backend-specific serving parameters for the recommended configuration.
      properties:
        backend:
          type: string
          description: Inference backend.
        tensor_parallel_size:
          type: integer
        max_model_len:
          type: integer
          nullable: true
          description: Resolved maximum sequence length; null when the simulator applied a context-length policy.
        max_model_len_policy:
          type: string
          nullable: true
          description: Policy name when `max_model_len` is null (for example `auto`).
        max_num_seqs:
          type: integer
          nullable: true
          description: Maximum concurrent sequences.
        max_num_batched_tokens:
          type: integer
          nullable: true
          description: Maximum tokens in a scheduled batch, when specified by the simulator.
        gpu_memory_utilization:
          type: number
          nullable: true
          description: Fraction of GPU memory to use (0.0-1.0), when the simulator reports one.
        enable_chunked_prefill:
          type: boolean
          nullable: true
          description: Null when the simulator's scenario does not state this backend setting.
        enable_prefix_caching:
          type: boolean
          nullable: true
          description: Null when the simulator's scenario does not state this backend setting.
        quantization:
          type: string
          description: Quantization mode (fp8, int8, auto, etc).

    # ── Estimate ───────────────────────────────────────────────────────────

    EstimateRequest:
      type: object
      required: [model_path, system]
      properties:
        model_path:
          type: string
          description: HuggingFace model path or SDK model key.
          example: Qwen/Qwen3-32B
        system:
          type: string
          description: GPU system identifier.
          example: h200_sxm
        simulator:
          type: string
          default: aisimulate
          description: Simulator to use. Discover supported values from GET /simulators. A request never falls back to another simulator.
        backend:
          type: string
          description: Inference backend.
          enum: [vllm, sglang, trtllm]
          default: vllm
        backend_version:
          type: string
          nullable: true
          description: |
            Backend version. AISimulate: null resolves to the system default
            (`current`, the same value `/backends` reports in
            `system_defaults`); the `current` alias behaves the same way. If
            that version has no performance data for the model, the service
            retries the newest declared versions and reports the one it used.
            Literal versions, `previous`, and `next` are pins and are never
            substituted: if the data cannot serve them, the request returns 422
            naming the versions the SDK ships for the system. BLIS: must be one
            of the modeled vLLM releases (0.29.0, 0.31.0, 0.32.0); null uses
            0.31.0. Aliases and unmodeled releases return 422.
          default: null
        mode:
          type: string
          enum: [agg, disagg]
          default: agg
          description: Serving mode. BLIS supports P/D predictions with matching system IDs and attention_dp_size=1.
        fabric:
          type: string
          nullable: true
          minLength: 1
          description: Inter-node fabric for P/D transfer; list values with GET /networks. BLIS consumes it; AISimulate does not.
          default: null
        decode_system:
          type: string
          nullable: true
          description: Decode GPU system. BLIS requires it to match system.
          default: null
        isl:
          type: integer
          description: Input sequence length (tokens).
          default: 4000
        osl:
          type: integer
          description: Output sequence length (tokens).
          default: 1000
        tp_size:
          type: integer
          description: Tensor parallel size.
          default: 1
        prefill_max_seq_len:
          type: integer
          nullable: true
          description: Prefill pool context limit for disaggregated predictions.
        decode_max_seq_len:
          type: integer
          nullable: true
          description: Decode pool context limit for disaggregated predictions.
        prefill_gpu_memory_utilization:
          type: number
          nullable: true
          description: Prefill pool GPU memory utilization.
        decode_gpu_memory_utilization:
          type: number
          nullable: true
          description: Decode pool GPU memory utilization.
        prefill_tp_size:
          type: integer
          nullable: true
        prefill_pp_size:
          type: integer
          nullable: true
        prefill_moe_tp_size:
          type: integer
          nullable: true
          minimum: 1
          description: MoE tensor width for the prefill pool. Falls back to `moe_tp_size`, then to `(prefill_tp_size * attention_dp_size)`.
        prefill_moe_ep_size:
          type: integer
          nullable: true
          minimum: 1
          description: MoE expert width for the prefill pool. Falls back to `moe_ep_size`, then to 1.
        prefill_batch_size:
          type: integer
          nullable: true
        prefill_num_workers:
          type: integer
          nullable: true
        decode_tp_size:
          type: integer
          nullable: true
        decode_pp_size:
          type: integer
          nullable: true
        decode_moe_tp_size:
          type: integer
          nullable: true
          minimum: 1
          description: MoE tensor width for the decode pool. Falls back to `moe_tp_size`, then to `(decode_tp_size * attention_dp_size)`.
        decode_moe_ep_size:
          type: integer
          nullable: true
          minimum: 1
          description: MoE expert width for the decode pool. Falls back to `moe_ep_size`, then to 1.
        decode_batch_size:
          type: integer
          nullable: true
        decode_num_workers:
          type: integer
          nullable: true
        pp_size:
          type: integer
          description: Pipeline parallel size.
          default: 1
        batch_size:
          type: integer
          description: Batch size (max concurrent requests).
          default: 128
        requests_per_load_unit:
          type: number
          nullable: true
          exclusiveMinimum: 0
          description: Optional simulated requests per concurrency slot. When omitted, the simulation stops after one total request.
          default: null
        database_mode:
          type: string
          description: Performance database mode.
          enum: [HYBRID, SILICON, EMPIRICAL, SOL]
          default: HYBRID
        gemm_quant_mode:
          type: string
          nullable: true
          default: null
        kvcache_quant_mode:
          type: string
          nullable: true
          default: null
        fmha_quant_mode:
          type: string
          nullable: true
          default: null
        moe_tp_size:
          type: integer
          nullable: true
          default: null
          minimum: 1
          description: |
            MoE/FFN tensor width. When both `moe_tp_size` and `moe_ep_size` are
            omitted, the API resolves the pair to
            `(tp_size * attention_dp_size, 1)`: the FFN or expert block is
            tensor-sharded across the attention group with no expert
            parallelism. This default also applies to dense variants of
            MoE-capable families, such as dense Gemma 4. When only one width is
            supplied, the other is inferred from the attention width.
        moe_ep_size:
          type: integer
          nullable: true
          default: null
          minimum: 1
          description: |
            MoE/FFN expert width. Omitted alongside `moe_tp_size`, it resolves
            to 1; supplied alone, `moe_tp_size` is inferred from the attention
            width.
        attention_dp_size:
          type: integer
          default: 1
        inclusive_tpot:
          type: boolean
          description: |
            Report TPOT as (ttft + tpot * (osl - 1)) / osl, spreading TTFT across all
            output tokens. Useful for comparing with benchmarks that report inclusive
            TPOT (e.g. GuideLLM).
          default: false
        model_config:
          type: object
          nullable: true
          description: Pre-fetched HuggingFace model config.json. Skips the HF download when supplied.
          default: null

    EstimateResponse:
      type: object
      required: [ttft, tpot]
      description: Single-point performance estimate for a given parallelism configuration.
      properties:
        simulator:
          type: string
          description: Simulator that produced the result, as reported by the service.
        mode:
          type: string
          enum: [agg, disagg]
          description: Serving mode used for this prediction.
        prefill_config:
          nullable: true
          description: Prefill pool configuration for disaggregated predictions.
          $ref: '#/components/schemas/WorkerConfig'
        decode_config:
          nullable: true
          description: Decode pool configuration for disaggregated predictions.
          $ref: '#/components/schemas/WorkerConfig'
        provenance:
          $ref: '#/components/schemas/SimulatorProvenance'
        memory_unavailable_reason:
          type: string
          nullable: true
          description: Why an optional memory breakdown was not provided by the selected simulator.
        warnings:
          type: array
          items: { type: string }
        ttft:
          type: number
          description: Predicted TTFT (ms).
        tpot:
          type: number
          description: Predicted TPOT (ms).
        request_latency:
          type: number
          nullable: true
          description: Predicted end-to-end request latency (ms).
        tokens_per_second:
          type: number
          nullable: true
          description: Total tokens/s.
        tokens_per_second_per_gpu:
          type: number
          nullable: true
          description: Tokens/s per GPU.
        tokens_per_second_per_user:
          type: number
          nullable: true
          description: Tokens/s per concurrent user.
        memory:
          type: number
          nullable: true
          description: Memory usage (GB).
        concurrency:
          type: integer
          nullable: true
          description: Concurrency level (batch size) at which these metrics hold.
        tp:
          type: integer
          nullable: true
          description: Tensor parallel size.
        pp:
          type: integer
          nullable: true
          description: Pipeline parallel size.
        dp:
          type: integer
          nullable: true
          description: Data parallel size.
        moe_tp:
          type: integer
          nullable: true
          description: |
            Resolved MoE/FFN tensor width for an aggregated prediction. Null for
            disaggregated predictions; see `prefill_config.moe_tp` and
            `decode_config.moe_tp`.
        moe_ep:
          type: integer
          nullable: true
          description: |
            Resolved MoE/FFN expert width for an aggregated prediction. Null for
            disaggregated predictions; see `prefill_config.moe_ep` and
            `decode_config.moe_ep`.
        system:
          type: string
          nullable: true
          description: GPU system used.
        backend:
          type: string
          nullable: true
          description: Backend used.
        backend_version:
          type: string
          nullable: true
          description: Backend version used.
        gemm:
          type: string
          nullable: true
          description: GEMM quantization mode.
        kvcache:
          type: string
          nullable: true
          description: KV cache quantization mode.
        power_w:
          type: number
          nullable: true
          description: Estimated power draw (watts).
        serving_config:
          nullable: true
          description: Serving configuration (present when include=config).
          $ref: '#/components/schemas/ServingConfig'
        memory_breakdown:
          nullable: true
          description: Per-component memory breakdown (present when include=memory).
          $ref: '#/components/schemas/MemoryBreakdown'

    # ── Memory ─────────────────────────────────────────────────────────────

    MemoryRequest:
      type: object
      required: [model_path, system]
      properties:
        model_path:
          type: string
          description: HuggingFace model path or SDK model key.
          example: QWEN3_32B
        system:
          type: string
          description: GPU system identifier.
          example: h200_sxm
        simulator:
          type: string
          default: aisimulate
          description: Simulator to use. Only a simulator that reports the memory capability accepts this endpoint; others return 422.
        backend:
          type: string
          description: Inference backend.
          enum: [vllm, sglang, trtllm]
          default: vllm
        backend_version:
          type: string
          nullable: true
          default: null
        max_num_tokens:
          type: integer
          description: Maximum KV cache token budget.
          default: 8192
        max_batch_size:
          type: integer
          description: Maximum batch size.
          default: 128
        memory_fraction_kind:
          type: string
          description: |
            How memory_fraction_value is interpreted.
            "of_total" for vLLM/SGLang, "of_free" for TRT-LLM.
          enum: [of_total, of_free]
          default: of_total
        memory_fraction_value:
          type: number
          description: Fraction of memory to use for KV cache [0.0, 1.0].
          default: 1.0
          minimum: 0.0
          maximum: 1.0
        tp_size:
          type: integer
          default: 1
        pp_size:
          type: integer
          default: 1
        attention_dp_size:
          type: integer
          default: 1
        moe_tp_size:
          type: integer
          nullable: true
          default: null
        moe_ep_size:
          type: integer
          nullable: true
          default: null
        gemm_quant_mode:
          type: string
          nullable: true
          default: null
        moe_quant_mode:
          type: string
          nullable: true
          default: null
        kvcache_quant_mode:
          type: string
          nullable: true
          default: null
        fmha_quant_mode:
          type: string
          nullable: true
          default: null
        comm_quant_mode:
          type: string
          nullable: true
          default: null
        tolerance_fraction:
          type: number
          nullable: true
          description: Safety margin [0.0, 1.0). Reduces KV budget by this fraction.
          default: null
        model_config:
          type: object
          nullable: true
          description: Pre-fetched HuggingFace model config.json. Skips the HF download when supplied.
          default: null

    MemoryResponse:
      type: object
      required: [total_gpu_capacity_bytes, total_kv_size_bytes, kv_size_per_token_bytes, total_kv_size_tokens, source, memory_breakdown]
      properties:
        simulator:
          type: string
          description: Simulator that provided the memory estimate. Only a simulator that reports the memory capability answers this endpoint.
        total_gpu_capacity_bytes:
          type: integer
          description: Total GPU memory capacity (bytes).
        total_kv_size_bytes:
          type: integer
          description: KV cache size (bytes).
        kv_size_per_token_bytes:
          type: integer
          description: KV cache per token (bytes).
        total_kv_size_tokens:
          type: integer
          description: Maximum tokens that fit in the KV cache.
        source:
          type: string
          enum: [native, naive_fallback]
          description: Estimation method used.
        memory_breakdown:
          $ref: '#/components/schemas/MemoryBreakdown'
        tolerance_adjusted:
          type: object
          nullable: true
          description: Adjusted values when tolerance_fraction is set.
          properties:
            total_kv_size_bytes:
              type: integer
            total_kv_size_tokens:
              type: integer
            tolerance_fraction:
              type: number

    MemoryBreakdown:
      type: object
      properties:
        weights_bytes:
          type: integer
          description: Model weights memory (bytes).
        activations_bytes:
          type: integer
          description: Activation memory (bytes).
        runtime_overhead_bytes:
          type: integer
          description: Runtime overhead memory (bytes).
        comm_overhead_bytes:
          type: integer
          description: Communication buffer memory (bytes).
        kv_cache_bytes:
          type: integer
          description: KV cache memory (bytes). Mirrors total_kv_size_bytes.

    # ── Catalog ────────────────────────────────────────────────────────────

    BackendListResponse:
      type: object
      required: [simulator, simulator_version, recommend_search, objectives, backends]
      properties:
        simulator:
          type: string
        simulator_version:
          type: string
          nullable: true
          description: The release of the selected simulator this deployment runs.
        recommend_search:
          type: string
          enum: [windowed, single]
          description: |
            Shape of the service's recommendation search. `windowed` means the
            service walks a GPU window ladder; `single` means one bounded
            search per action. Both are one client request.
        objectives:
          type: array
          description: |
            Sizing goals this simulator implements. Clients gate a goal selector
            on this list instead of on the simulator name. A goal absent from
            this list is not answered by a different simulator.
          items:
            type: string
            enum: [min_gpus, throughput_demand, pareto, concurrency_capacity]
        backends:
          type: array
          items:
            $ref: '#/components/schemas/BackendOption'

    BackendOption:
      type: object
      required: [id, versions]
      properties:
        id:
          type: string
          example: vllm
        aisimulate_id:
          type: string
          description: The corresponding AISimulate backend ID, when the simulator reuses one.
        versions:
          type: array
          description: Engine versions the simulator models.
          items:
            type: string
        default_version:
          type: string
          nullable: true
          description: |
            The version used when a request omits backend_version. AISimulate reports
            its per-system namespace (`current`); BLIS reports a literal release.
        memory_fraction:
          type: number
          nullable: true
          description: Fleet-level default memory fraction, when the simulator defines one.
        memory_fraction_kind:
          type: string
          enum: [of_total, of_free]
        runtime_field:
          type: string
          nullable: true
        systems:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        system_defaults:
          type: object
          additionalProperties:
            type: object
            properties:
              version:
                type: string
                nullable: true
              memory_fraction:
                type: number
                nullable: true
        disaggregation_requires_fabric:
          type: boolean
          description: |
            Whether a prefill/decode topology needs an inter-node fabric selected
            before the request is sent. BLIS prices the KV transfer through a named
            fabric; AISimulate's P/D search takes none.
        capacity_options:
          type: object
          description: |
            Which comparison options a concurrency-capacity run can return for
            this backend. Clients gate disaggregated option presentation on
            these flags instead of inferring support from the simulator name.
          properties:
            disaggregated:
              type: boolean
              description: |
                Whether capacity runs can include disaggregated alternatives.
                AISimulate reports true; BLIS reports false because its
                concurrency-capacity sizing is aggregate-only.
        version_support:
          type: object
          description: Per-version capabilities. Present when simulator=blis.
          additionalProperties:
            type: object
            properties:
              disaggregated:
                type: boolean
                description: Whether the release can run a prefill/decode topology.
              max_model_len_auto:
                type: boolean
                description: Whether the release accepts max_model_len=auto.

    ModelListResponse:
      type: object
      required: [simulator, model_catalog_complete, models]
      properties:
        simulator:
          type: string
          description: Simulator that produced the result, as reported by the service.
        model_catalog_complete:
          type: boolean
          description: |
            True when `models` is the complete set this simulator can price.
            False when the simulator can also resolve models outside the list,
            so absence from the list is not an unsupported verdict.
        models:
          type: array
          description: Sorted list of models. Items are strings without include=specs, objects with include=specs.
          items:
            oneOf:
              - type: string
              - $ref: '#/components/schemas/ModelEntry'

    ModelEntry:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: HuggingFace model identifier.
          example: Qwen/Qwen3-235B-A22B
        num_experts:
          type: integer
          nullable: true
          description: Total number of experts (null for dense models).
        num_experts_per_tok:
          type: integer
          nullable: true
          description: Experts activated per token — top-k (null for dense models).
        context_length:
          type: integer
          nullable: true
          description: Maximum context window in tokens.
        num_attn_heads:
          type: integer
          nullable: true
          description: Number of query attention heads.
        num_kv_heads:
          type: integer
          nullable: true
          description: Number of KV heads (less than num_attn_heads when GQA is used).
        architecture:
          type: string
          nullable: true
          description: HuggingFace model architecture class name.
          example: Qwen3MoeForCausalLM

    SystemListResponse:
      type: object
      required: [simulator, systems]
      properties:
        simulator:
          type: string
          description: Simulator that produced the result, as reported by the service.
        systems:
          type: array
          items:
            $ref: '#/components/schemas/SystemEntry'
          description: List of supported GPU systems.

    SystemEntry:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: System identifier.
          example: h200_sxm
        name:
          type: string
          description: Human-readable GPU name.
          example: NVIDIA H200 SXM
        # Fields below are present when include=specs
        vendor:
          type: string
          nullable: true
          example: nvidia
        architecture:
          type: string
          nullable: true
          example: hopper
        memory_bytes:
          type: integer
          description: GPU memory capacity in bytes.
        memory_bandwidth_bytes:
          type: integer
          description: Peak memory bandwidth in bytes per second.
        bf16_tflops:
          type: number
          description: BF16 tensor core throughput in TFLOPS.
        tdp_watts:
          type: number
          description: Thermal design power (watts).
        gpus_per_node:
          type: integer
          description: Number of GPUs per node.

    # ── Error ──────────────────────────────────────────────────────────────

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message.
